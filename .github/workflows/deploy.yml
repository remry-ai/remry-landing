name: Deploy to Cloudflare Pages

# main deploys to production (remry.ai); any other branch gets a preview URL.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT: remry-landing

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for unfilled placeholders
        run: |
          if grep -rnE '\[(NEWSLETTER_URL|STANDARD_PRICE)\]' public; then
            echo "::warning::Placeholders remain in public/ (see README). Replace them before launch."
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Create the Pages project (first run only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if npx --yes wrangler@4 pages project list | grep -qw "$PROJECT"; then
            echo "Project $PROJECT exists."
          else
            npx --yes wrangler@4 pages project create "$PROJECT" --production-branch main
          fi

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 pages deploy public \
            --project-name "$PROJECT" \
            --branch "${GITHUB_REF_NAME}" \
            --commit-hash "${GITHUB_SHA}" \
            --commit-dirty=true
